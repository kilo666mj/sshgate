---
- name: Deploy sshgate
  hosts: sshgate
  become: true
  vars:
    sshgate_user: sshgate
    sshgate_group: sshgate
    sshgate_data_dir: /var/lib/sshgate
    sshgate_config_dir: /etc/sshgate
    sshgate_binary: /usr/local/bin/sshgate
    sshgate_db: "{{ sshgate_data_dir }}/sshgate.db"
    sshgate_config: "{{ sshgate_config_dir }}/config.json"
    sshgate_goos: linux
    sshgate_goarch_map:
      x86_64: amd64
      aarch64: arm64
      arm64: arm64
      armv7l: arm
      armv6l: arm
    sshgate_goarch: "{{ sshgate_goarch_map.get(ansible_facts['architecture'], ansible_facts['architecture']) }}"
    sshgate_build_output: "{{ playbook_dir }}/../sshgate-{{ sshgate_goos }}-{{ sshgate_goarch }}"

  tasks:
    - name: Install firewalld
      ansible.builtin.package:
        name: firewalld
        state: present

    - name: Enable and start firewalld
      ansible.builtin.systemd:
        name: firewalld
        enabled: true
        state: started

    - name: Allow sshgate through firewalld
      ansible.posix.firewalld:
        zone: public
        port: "{{ sshgate_source_port }}/tcp"
        permanent: true
        immediate: true
        state: enabled

    # Describe the checkout so a deployed host reports what it is actually
    # running. Without this the binary keeps main.version's "dev" default, and
    # `sshgate version` on a host tells you nothing about which build it has.
    - name: Describe the checkout for the version stamp
      ansible.builtin.command:
        cmd: git describe --tags --always --dirty
        chdir: "{{ playbook_dir }}/.."
      delegate_to: localhost
      become: false
      changed_when: false
      register: sshgate_git_describe
      failed_when: false

    - name: Build sshgate locally
      ansible.builtin.command:
        cmd: >-
          go build -trimpath
          -ldflags "-s -w -X main.version={{ sshgate_version }}"
          -o {{ sshgate_build_output | quote }} .
        chdir: "{{ playbook_dir }}/.."
      environment:
        CGO_ENABLED: "0"
        GOOS: "{{ sshgate_goos }}"
        GOARCH: "{{ sshgate_goarch }}"
      vars:
        sshgate_version: "{{ sshgate_git_describe.stdout | default('dev', true) | trim }}"
      delegate_to: localhost
      become: false
      changed_when: true

    - name: Create sshgate group
      ansible.builtin.group:
        name: "{{ sshgate_group }}"
        system: true

    - name: Create sshgate user
      ansible.builtin.user:
        name: "{{ sshgate_user }}"
        group: "{{ sshgate_group }}"
        home: "{{ sshgate_data_dir }}"
        create_home: false
        system: true
        shell: /usr/sbin/nologin

    - name: Create sshgate data directory
      ansible.builtin.file:
        path: "{{ sshgate_data_dir }}"
        state: directory
        owner: "{{ sshgate_user }}"
        group: "{{ sshgate_group }}"
        mode: "0750"

    - name: Create sshgate config directory
      ansible.builtin.file:
        path: "{{ sshgate_config_dir }}"
        state: directory
        owner: root
        group: "{{ sshgate_group }}"
        mode: "0750"

    - name: Install sshgate binary
      ansible.builtin.copy:
        src: "{{ sshgate_build_output }}"
        dest: "{{ sshgate_binary }}"
        owner: root
        group: root
        mode: "0755"
      notify: Restart sshgate

    - name: Check for existing sshgate config
      ansible.builtin.stat:
        path: "{{ sshgate_config }}"
      register: sshgate_existing_config_file

    - name: Read existing sshgate config
      ansible.builtin.slurp:
        src: "{{ sshgate_config }}"
      register: sshgate_existing_config
      when: sshgate_existing_config_file.stat.exists
      no_log: true

    - name: Preserve existing sshgate control-plane configuration
      ansible.builtin.set_fact:
        sshgate_effective_control_plane: >-
          {{ ((sshgate_existing_config.content | b64decode | from_json).control_plane)
             if (sshgate_control_plane is not defined and sshgate_existing_config_file.stat.exists)
             else (sshgate_control_plane | default({})) }}
      no_log: true

    - name: Install sshgate config
      ansible.builtin.template:
        src: templates/config.json.j2
        dest: "{{ sshgate_config }}"
        owner: root
        group: "{{ sshgate_group }}"
        mode: "0640"
      notify: Restart sshgate

    - name: Seed approved sshgate fingerprints
      ansible.builtin.command:
        argv: "{{ [sshgate_binary, 'approve', '--db', sshgate_db, '--register'] + (((item.label | default('')) | length > 0) | ternary(['--label', item.label], [])) + [item.fingerprint] }}"
      loop: "{{ sshgate_approved_fingerprints }}"
      changed_when: false

    # The seed runs as root so Ansible does not need to become an unprivileged
    # service account. Hand the database and WAL sidecars back before start.
    - name: Ensure sshgate data ownership
      ansible.builtin.file:
        path: "{{ sshgate_data_dir }}"
        state: directory
        owner: "{{ sshgate_user }}"
        group: "{{ sshgate_group }}"
        recurse: true

    - name: Install systemd unit
      ansible.builtin.template:
        src: templates/sshgate.service.j2
        dest: /etc/systemd/system/sshgate.service
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd
        - Restart sshgate

    - name: Apply service changes before first start
      ansible.builtin.meta: flush_handlers

    - name: Reset connection after sshgate restart
      ansible.builtin.meta: reset_connection

    - name: Wait for sshgate to accept connections again
      ansible.builtin.wait_for_connection:
        delay: 2
        timeout: 30

    - name: Enable and start sshgate
      ansible.builtin.systemd:
        name: sshgate
        enabled: true
        state: started

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    # reload-or-restart performs a graceful upgrade when sshgate is already
    # running: systemctl runs ExecReload (SIGHUP), tableflip re-execs the new
    # binary and hands off the listening sockets, and existing SSH sessions —
    # including Ansible's own connection when it runs through sshgate — survive.
    # It falls back to a start/restart when the service is not yet running (e.g.
    # first deploy). Fire-and-forget so a rare non-graceful restart cannot hang
    # the play if the control connection blips.
    #
    # This was temporarily forced to a hard `restart` while the fleet still had
    # pre-tableflip binaries, which treat SIGHUP as a clean stop and never come
    # back. Every host in the inventory was confirmed tableflip-capable during
    # the gatekit rollout, so the graceful path is safe again.
    - name: Restart sshgate
      ansible.builtin.command:
        cmd: systemctl reload-or-restart sshgate
      changed_when: true
      async: 45
      poll: 0
